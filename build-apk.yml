name: Build Android APK

# Builds a signed Android APK (and AAB for Play Store) from the Trusted Web
# Activity project in /android, using Google's Bubblewrap CLI.
#
# One-time setup required before this workflow will succeed — see
# ANDROID_APK.md in the repo root. In short: run `bubblewrap init` once
# (in a GitHub Codespace or locally) to generate /android and a signing
# keystore, commit everything except the keystore itself, and add the
# ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD
# repo secrets described in that guide.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/twa-manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Bubblewrap requires exactly JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # Points Bubblewrap at the JDK/SDK the steps above already installed,
      # so it never falls back to its own interactive "download JDK?" prompt
      # (which would hang forever in CI with no terminal to answer it).
      - name: Configure Bubblewrap to use the pre-installed JDK/SDK
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json

      - name: Restore signing keystore from secret
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Build signed APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: meeting-register-android
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
          if-no-files-found: error
